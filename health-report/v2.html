<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Динамика анализов</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f5f3ec;color:#1f2933}header{padding:24px 18px;background:#e4eee7;border-bottom:1px solid #cbd8cf}h1{margin:0 0 8px;font-size:28px;line-height:1.1}p{margin:0;color:#52606d;line-height:1.45}.wrap{max-width:1040px;margin:auto;padding:16px 12px 36px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.stat,.card{background:white;border:1px solid #ddd7cb;border-radius:8px}.stat{padding:12px}.stat strong{display:block;font-size:22px}.toc{display:flex;gap:7px;overflow:auto;padding:4px 0 14px;margin-bottom:8px}.toc a{flex:0 0 auto;padding:7px 10px;border-radius:999px;border:1px solid #d8d2c7;background:white;color:#245d6b;text-decoration:none;font-size:13px}.card{padding:15px;margin:0 0 14px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.num{font-size:12px;color:#7a826f;margin-bottom:3px}.name{margin:0;font-size:21px}.trend{text-align:right;color:#52606d;font-size:13px}.trend b{display:block;color:#243b44;font-size:15px}svg{display:block;width:100%;height:auto;margin:10px 0}.grid{stroke:#ece7dc}.band{fill:#d8eadf;opacity:.9}.line{fill:none;stroke:#d66f5c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dot{fill:#245d6b;stroke:white;stroke-width:2}.bad{fill:#a34835}.axis{fill:#687583;font-size:12px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 5px;border-bottom:1px solid #eee8dc;text-align:left}th{color:#65707e}.out{color:#a34835;font-weight:700}@media(max-width:700px){.head{display:block}.trend{text-align:left;margin-top:8px}.name{font-size:19px}table{font-size:12px}}
</style>
</head>
<body>
<header><h1>Все графики анализов</h1><p>Автоматическая визуализация числовых показателей из PDF. Это не диагноз и не медицинская рекомендация.</p></header>
<main class="wrap"><section class="stats" id="stats"></section><nav class="toc" id="toc"></nav><section id="charts"></section></main>
<script>
const fmt=n=>n==null?"":Math.abs(n)>=100?n.toFixed(0):Math.abs(n)>=10?String(+n.toFixed(1)):String(+n.toFixed(2));
const dd=s=>s.split("-").reverse().join(".");
const d2=s=>{const a=s.split("-");return `${a[2]}.${a[1]}.${a[0].slice(2)}`};
function status(r){if(r.lo!=null&&r.v<r.lo)return"ниже";if(r.hi!=null&&r.v>r.hi)return"выше";if(r.lo!=null||r.hi!=null)return"в норме";return""}
function trend(rows){const f=rows[0].v,l=rows.at(-1).v;if(f===0)return`${fmt(f)} -> ${fmt(l)}`;const p=(l-f)/Math.abs(f)*100;const dir=p>15?"вверх":p<-15?"вниз":"примерно стабильно";return`${dir}: ${fmt(f)} -> ${fmt(l)} (${p>0?"+":""}${p.toFixed(0)}%)`}
function chart(rows){const W=900,H=285,L=54,R=20,T=22,B=48,vals=rows.flatMap(r=>[r.v,r.lo,r.hi].filter(x=>x!=null));let lo=Math.min(...vals),hi=Math.max(...vals);if(lo===hi){lo-=1;hi+=1}const pw=W-L-R,ph=H-T-B,x=i=>L+(rows.length===1?pw/2:i*pw/(rows.length-1)),y=v=>T+(hi-v)/(hi-lo)*ph;let g="";for(let i=0;i<5;i++){const v=lo+(hi-lo)*i/4,yy=y(v);g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="axis" x="8" y="${yy+4}">${fmt(v)}</text>`}const lows=rows.map(r=>r.lo).filter(x=>x!=null),his=rows.map(r=>r.hi).filter(x=>x!=null);let band="";if(lows.length>=2&&his.length>=2){const blo=lows.sort((a,b)=>a-b)[Math.floor(lows.length/2)],bhi=his.sort((a,b)=>a-b)[Math.floor(his.length/2)];if(blo<bhi)band=`<rect class="band" x="${L}" y="${y(bhi)}" width="${pw}" height="${Math.max(2,y(blo)-y(bhi))}"/>`}const pts=rows.map((r,i)=>`${x(i)},${y(r.v)}`).join(" ");const dots=rows.map((r,i)=>`<circle class="dot ${status(r)==="выше"||status(r)==="ниже"?"bad":""}" cx="${x(i)}" cy="${y(r.v)}" r="5"><title>${dd(r.d)}: ${fmt(r.v)}</title></circle>`).join("");const labs=rows.map((r,i)=>`<text class="axis" x="${x(i)}" y="${H-15}" text-anchor="middle">${d2(r.d)}</text>`).join("");return`<svg viewBox="0 0 ${W} ${H}">${g}${band}<polyline class="line" points="${pts}"/>${dots}${labs}</svg>`}
function applyPatch(data,patch){if(!patch)return data;data.summary={...data.summary,...patch.summary};const map=new Map(data.charts.map(c=>[c.name,c]));for(const c of patch.charts||[])map.set(c.name,c);data.charts=[...map.values()];return data}
function render(data){const s=data.summary;stats.innerHTML=`<div class="stat"><strong>${s.pdf_count}</strong>PDF/текстов</div><div class="stat"><strong>${s.record_count}</strong>строк</div><div class="stat"><strong>${s.indicator_count}</strong>показателей</div><div class="stat"><strong>${s.chart_count}</strong>графиков</div>`;toc.innerHTML=data.charts.map((c,i)=>`<a href="#c${i+1}">${c.name}</a>`).join("");charts.innerHTML=data.charts.map((c,i)=>{const trs=c.rows.map(r=>{const st=status(r),ref=r.lo!=null||r.hi!=null?`${fmt(r.lo)} - ${fmt(r.hi)}`:"";return`<tr><td>${dd(r.d)}</td><td>${fmt(r.v)}</td><td>${c.unit||r.u}</td><td>${ref}</td><td class="${st==="выше"||st==="ниже"?"out":""}">${st}</td></tr>`}).join("");return`<article class="card" id="c${i+1}"><div class="head"><div><div class="num">${String(i+1).padStart(2,"0")} / ${data.charts.length}</div><h2 class="name">${c.name}</h2></div><div class="trend"><b>${trend(c.rows)}</b><span>${c.rows.length} точек, ${dd(c.rows[0].d)} - ${dd(c.rows.at(-1).d)}${c.unit?", "+c.unit:""}</span></div></div>${chart(c.rows)}<table><thead><tr><th>Дата</th><th>Значение</th><th>Ед.</th><th>Референс</th><th>Статус</th></tr></thead><tbody>${trs}</tbody></table></article>`}).join("")}
Promise.all([fetch("data.json").then(r=>r.json()),fetch("patch.json").then(r=>r.ok?r.json():null).catch(()=>null)]).then(([data,patch])=>render(applyPatch(data,patch)));
</script>
</body>
</html>
